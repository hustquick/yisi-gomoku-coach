plugins {
    id "com.android.application"
}

def generatedEngineAssets = file("$buildDir/generated/engineAssets")

android {
    namespace "com.yisi.gomokucoach"
    compileSdk 35
    ndkVersion "28.0.13004108"

    defaultConfig {
        applicationId "com.yisi.gomokucoach"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets.main.assets.srcDirs = ["src/main/assets", generatedEngineAssets]
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}

tasks.register("syncRapfiAssets", Copy) {
    from(rootProject.file("../engine/runtime/macos-arm64")) {
        include "config.toml"
        include "model210901.bin"
        include "mix9svq*.bin.lz4"
        include "RAPFI-GPL-3.0.txt"
    }
    into generatedEngineAssets
}

tasks.named("preBuild").configure { dependsOn tasks.named("syncRapfiAssets") }
